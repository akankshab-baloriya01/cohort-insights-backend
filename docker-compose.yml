services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-cohort}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MAX_ACTIVE_PER_USER: ${MAX_ACTIVE_PER_USER:-3}
      ACTIVE_KEY_TTL: ${ACTIVE_KEY_TTL:-3600}
      CACHE_TTL: ${CACHE_TTL:-86400}
      WORKER_COUNT: ${WORKER_COUNT:-2}
      STAGE_TIME_SCALE: ${STAGE_TIME_SCALE:-1}
      FAILURE_RATE: ${FAILURE_RATE:-0.1}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo_data:
